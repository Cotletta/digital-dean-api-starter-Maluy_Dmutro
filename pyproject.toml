[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-dean-api"
version = "0.2.0"
description = "Навчальний API інформаційної системи Цифровий деканат"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "email-validator>=2.2.0",
    "cryptography>=48.0.1",
    "pycryptodome>=3.24.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]